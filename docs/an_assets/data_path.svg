<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-labelledby="title desc">
  <title id="title">E2CF Data and Management Paths</title>
  <desc id="desc">Transmit, receive, configuration, heartbeat, time, event, and statistics paths between Linux and MCXE31B.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#174A7C"/>
    </marker>
    <style>
      svg { text-rendering: geometricPrecision; shape-rendering: geometricPrecision; }
      .title { font: 700 18px Arial, sans-serif; fill: #17324D; }
      .label { font: 700 13px Arial, sans-serif; fill: #17324D; }
      .body { font: 12px Arial, sans-serif; fill: #23384D; }
      .small { font: 10.5px Arial, sans-serif; fill: #395166; }
      .host { fill: #F8FAFC; stroke: #7890A8; stroke-width: 1.3; rx: 7; }
      .mcu { fill: #EFF6FF; stroke: #2E74B5; stroke-width: 1.5; rx: 7; }
      .can { fill: #F6F8FB; stroke: #647486; stroke-width: 1.2; rx: 6; }
      .legend { fill: #F8FAFC; stroke: #D4DEE8; stroke-width: 1; rx: 6; }
      .line { stroke: #174A7C; stroke-width: 2.15; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #63798D; stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
      .sample { stroke: #174A7C; stroke-width: 2.15; fill: none; }
      .sampleDash { stroke: #63798D; stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="390" fill="#FFFFFF"/>
  <text x="28" y="34" class="title">E2CF data and management paths</text>

  <rect x="42" y="76" width="216" height="198" class="host"/>
  <text x="76" y="107" class="label">Linux eth2can driver</text>
  <text class="body">
    <tspan x="72" y="137">SocketCAN TX/RX</tspan>
    <tspan x="72" y="159">Echo slots: 16 per channel</tspan>
    <tspan x="72" y="181">CFG transactions</tspan>
    <tspan x="72" y="203">TIME mapping</tspan>
    <tspan x="72" y="225">ethtool/debugfs statistics</tspan>
  </text>

  <rect x="338" y="62" width="246" height="226" class="mcu"/>
  <text x="386" y="93" class="label">MCXE31B firmware</text>
  <text class="body">
    <tspan x="372" y="125">E2CF parser and aggregator</tspan>
    <tspan x="372" y="147">TXC completion return</tspan>
    <tspan x="372" y="169">Heartbeat safe-state gate</tspan>
    <tspan x="372" y="191">DWT-based gateway time</tspan>
    <tspan x="372" y="213">EVT and STATS reporting</tspan>
  </text>

  <rect x="680" y="84" width="164" height="70" class="can"/>
  <text x="718" y="115" class="label">FlexCAN TX</text>
  <text x="704" y="140" class="body">single active TX MB</text>

  <rect x="680" y="218" width="164" height="70" class="can"/>
  <text x="718" y="249" class="label">FlexCAN RX</text>
  <text x="708" y="274" class="body">RX MB bank scan</text>

  <path d="M258 132 C288 132, 306 120, 330 120" class="line"/>
  <path d="M258 182 C288 182, 306 182, 330 182" class="dash"/>
  <path d="M338 218 C308 218, 288 218, 258 218" class="dash"/>
  <path d="M338 258 C308 258, 288 248, 258 248" class="line"/>

  <path d="M584 116 C622 116, 644 116, 672 116" class="line"/>
  <path d="M584 150 C622 150, 644 140, 672 140" class="dash"/>
  <path d="M672 253 C638 253, 620 244, 584 244" class="line"/>

  <rect x="54" y="310" width="772" height="62" class="legend"/>
  <line x1="74" y1="329" x2="116" y2="329" class="sample"/>
  <line x1="74" y1="351" x2="116" y2="351" class="sampleDash"/>
  <text class="small">
    <tspan x="126" y="333">Solid paths: DATA request to gateway, CAN TX/RX, and DATA/TXC records returned to Linux.</tspan>
    <tspan x="126" y="355">Dashed paths: CFG_REQ, CFG_RSP, TIME, EVT, STATS, HB, and TXC completion status.</tspan>
  </text>
</svg>
